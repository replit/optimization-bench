schema_version = "1.4"
# Only the editable Black packages reach the separate verifier.
artifacts = [
  { source = "/app/black/src/black" },
  { source = "/app/black/src/blib2to3" },
  { source = "/app/black/src/blackd" },
]

[task]
name = "optimbench/black-project-format"
version = "1.0.0"
description = "Speed up native Black (v1.0): a real CI check with formatting violations and an in-place line-length migration, eight workers and one cold process per operation, plus two warm-process API workloads (format_str on documentation fragments, format_file_contents with line ranges for editor requests)."
keywords = ["optimbench", "performance", "python", "mypyc", "formatter", "cli", "standalone"]

[metadata]
category = "library-optimization"

[metadata.optimbench]
baseline_git_commit = "674dd88e5d714d97ea22bc77c34bb64783513a9f"
baseline_git_tree = "e75a5a079beaebcd2831d7d45b722dd7f338f34f"
baseline_git_date = "2000-01-01T00:00:00+0000"
status = "qualification-in-progress"
library = "Black (psf/black)"
language = "Python + mypyc"
run_mode = "standalone"
upstream_repo = "https://github.com/psf/black"
upstream_commit = "87928e6d6761a4a6d22250e1fee5601b3998086e"
definition = "task.json"
provenance = "provenance.json"
source_lock = "environment/source.lock.json"
driver = "environment/workload/task.py"
input_manifest = "environment/workload/inputs/manifest.json"
input_visibility = "public_dev"
portable_environment_ready = true
verifier_ready = false

[verifier]
timeout_sec = 5400.0
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 7200.0

[environment]
# Published image, pinned by digest (or build from environment/):
# docker_image = "public.ecr.aws/h1f5v5u6/optimbench:black-project-format-1.0.0@sha256:d0c608a597357d1e90209cf1aac12e4d30b7c9c463d1ad3634b32a244d37409a"
# The agent works offline: everything it needs is baked into the image.
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 16384
